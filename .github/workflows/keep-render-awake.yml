name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --silent --show-error --location \
            --max-time 25 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            https://warriors-gymnastics-management.onrender.com/api/health || true
